[project]
name = "catalog-web-api"
version = "0.1.0"
description = "Public service for the catalog web app: reads the catalog and submits products to Infrahub for review."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "infrahub-sdk>=1.23.2",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: needs the local Infrahub instance and a service account token"]
addopts = "-m 'not integration' -p no:pytest-infrahub"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
