      - building_block: Observability
        extent: full
        note: Storing the discovered network state as a model and analysing it is the main purpose of
          the product.
        sources:
        - https://ipfabric.io/
  - name: Agentic NetOps Platform
    publisher: NetBrain Technologies
    description: Collects device, topology and path data from multi-vendor networks and uses it for AI-assisted
      diagnosis, compliance assessment and change runbooks with pre-checks and post-checks.
    homepage_url: https://www.netbrain.com/platform/
    license_model: commercial
    license_model_sources:
