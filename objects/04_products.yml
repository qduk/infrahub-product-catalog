    homepage_url: https://www.gns3.com/
    license_model: open_source
    license_model_sources:
    - https://github.com/GNS3/gns3-server/blob/master/LICENSE
    publisher_sources:
    - https://docs.gns3.com/docs-3.1-en
    description_sources:
    - https://github.com/GNS3/gns3-server
  - name: Event-Driven Automation (EDA)
    publisher: Nokia
    description: Nokia EDA is a Kubernetes-based platform where users declare the desired state of fabrics,
      interfaces and services, which it translates into multivendor device configuration and checks against
      streaming telemetry.
    homepage_url: https://docs.eda.dev/
    license_model: commercial
    license_model_sources:
    - https://docs.eda.dev/26.8/getting-started/try-eda/
    publisher_sources:
    - https://docs.eda.dev/26.8/
    description_sources:
    - https://docs.eda.dev/26.8/
    coverage_claims:
      data:
      - building_block: Intent
        extent: full
        note: Storing and processing declared desired state is the main purpose of EDA, and it covers
          both configuration and expected state.
        sources:
        - https://docs.eda.dev/26.8/
      - building_block: Executor
        extent: full
        note: EDA applies configuration changes to devices from the intended state, including validation
          and network-wide rollback.
        sources:
        - https://docs.eda.dev/26.8/
      - building_block: Observability
        extent: partial
        note: EDA stores and queries operational state, but the page limits this to what EDA itself deploys.
        sources:
        - https://docs.eda.dev/26.8/
  - name: netlab
