    publisher_sources:
    - https://github.com/srl-labs/containerlab/blob/main/LICENSE
    description_sources:
    - https://containerlab.dev/
  - name: GNS3
    publisher: GNS3 Technologies
    description: GNS3 is a graphical network simulator whose server runs emulators such as Dynamips, VirtualBox
