    homepage_url: https://www.juniper.net/us/en/products/network-automation/apstra-data-center-director.html
    license_model: commercial
    license_model_sources:
    - https://www.juniper.net/us/en/products/network-automation/apstra-data-center-director.html
    publisher_sources:
