    homepage_url: https://netlab.tools/
    license_model: open_source
    license_model_sources:
    - https://github.com/ipspace/netlab/blob/dev/LICENSE.md
    publisher_sources:
    - https://github.com/ipspace/netlab/blob/dev/LICENSE.md
    description_sources:
    - https://netlab.tools/
  - name: EVE-NG
    publisher: EVE-NG
    description: EVE-NG is a multivendor network emulation platform, managed through a web browser, that
      runs virtual routers, firewalls and containers to build lab, proof-of-concept and training environments.
    homepage_url: https://www.eve-ng.net/
    license_model: commercial
    license_model_sources:
    - https://www.eve-ng.net/index.php/download/
    publisher_sources:
    - https://www.eve-ng.net/
    description_sources:
    - https://www.eve-ng.net/
  - name: Modeling Labs
    publisher: Cisco
    description: Cisco Modeling Labs is an on-premises network simulation platform that runs Cisco and
