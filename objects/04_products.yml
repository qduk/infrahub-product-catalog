      client library.
    homepage_url: https://developer.cisco.com/modeling-labs/
    license_model: commercial
    license_model_sources:
    - https://developer.cisco.com/modeling-labs/
    publisher_sources:
    - https://developer.cisco.com/modeling-labs/
    description_sources:
    - https://developer.cisco.com/modeling-labs/
  - name: Forward Enterprise
    publisher: Forward Networks
    description: Builds a model of a hybrid network from device and cloud state and configuration, so
      teams can search it, verify its behavior and test proposed changes before deployment.
    homepage_url: https://www.forwardnetworks.com/forward-enterprise/
    license_model: commercial
    license_model_sources:
    - https://www.forwardnetworks.com/pricing/
    publisher_sources:
    - https://www.forwardnetworks.com/
    description_sources:
    - https://www.forwardnetworks.com/forward-enterprise/
    coverage_claims:
      data:
      - building_block: Observability
        extent: full
        note: Storing and analysing the actual network state in a model, including history, is the main
          purpose of the product.
        sources:
        - https://www.forwardnetworks.com/forward-enterprise/
      - building_block: Collector
        extent: full
        note: The product reads state and configuration from network devices and cloud instances to build
          its model.
        sources:
        - https://www.forwardnetworks.com/forward-enterprise/
      - building_block: Intent
        extent: partial
        note: The product stores and checks operational expectations (intent checks), but it is not where
          the desired configuration of the network is defined.
        sources:
        - https://www.forwardnetworks.com/forward-enterprise/
  - name: IP Fabric
    publisher: IP Fabric
    description: Discovers on-premises and cloud network devices through CLI and API calls and builds
