        sources:
        - https://www.paessler.com/prtg/prtg-network-monitor
  - name: pyATS
    publisher: Cisco
    description: pyATS is a Python test and validation framework that records the operational state of
      network devices, compares it before and after changes, and runs reusable tests against the network.
    homepage_url: https://developer.cisco.com/pyats/
    publisher_sources:
    - https://developer.cisco.com/pyats/
    description_sources:
    - https://developer.cisco.com/pyats/
    coverage_claims:
      data:
      - building_block: Collector
        extent: partial
        note: pyATS reads and stores device operational state, but it does so to support testing rather
          than as a general state collection service.
        sources:
        - https://developer.cisco.com/pyats/
      - building_block: Observability
        extent: partial
        note: pyATS processes collected state to find differences, but it does not persist the actual
          network state as a continuous store.
        sources:
        - https://developer.cisco.com/pyats/
  - name: NUTS
    publisher: Network Unit Testing System
    description: NUTS is a pytest plugin that reads the desired network state from YAML test bundles,
      queries devices through Nornir and checks whether the results match.
    homepage_url: https://nuts.readthedocs.io/en/latest/
    license_model: open_source
    license_model_sources:
    - https://github.com/network-unit-testing-system/nuts/blob/master/LICENSE
    publisher_sources:
    - https://github.com/network-unit-testing-system/nuts/blob/master/LICENSE
    description_sources:
    - https://nuts.readthedocs.io/en/latest/
    coverage_claims:
      data:
      - building_block: Intent
        extent: partial
        note: Test bundles store expected operational state as YAML files, but NUTS does not hold configuration
          intent or a persistent store of desired state.
        sources:
        - https://github.com/network-unit-testing-system/nuts
      - building_block: Observability
        extent: partial
        note: NUTS processes retrieved state against expectations, but it does not persist the actual
          network state.
        sources:
        - https://nuts.readthedocs.io/en/latest/
      - building_block: Collector
        extent: partial
        note: NUTS reads device state only for the duration of a test run and only for the data its tests
          need.
        sources:
        - https://nuts.readthedocs.io/en/latest/
  - name: Netpicker
    publisher: Flock9
    description: Netpicker backs up device configurations and runs Python and pytest tests for configuration,
      compliance and security against network devices, with optional automated remediation jobs.
    homepage_url: https://netpicker.io/
    license_model: commercial
    license_model_sources:
    - https://netpicker.io/pricing/
    publisher_sources:
    - https://netpicker.io/about-us/
    description_sources:
    - https://netpicker.io/
    coverage_claims:
      data:
      - building_block: Collector
        extent: partial
        note: Netpicker retrieves and stores device configurations, which is one part of the actual network
          state.
        sources:
        - https://netpicker.io/
      - building_block: Observability
        extent: partial
        note: Netpicker processes collected state through tests and compliance rules, but it is not a
          general store and analysis layer for all operational state.
        sources:
        - https://netpicker.io/
      - building_block: Executor
        extent: partial
        note: Netpicker applies changes to devices through remediation jobs, as an extension of its testing
          and backup functions.
        sources:
        - https://netpicker.io/
  - name: Containerlab
    publisher: Nokia
