---
# Network automation products and the framework building blocks they cover.
# Every fact links to a source from 02_sources.yml. See specs/001-catalog-schema/research.md R10.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CatalogProduct
  data:
    - name: Infrahub
      publisher: OpsMill
      description: >-
        A graph-based data management platform with built-in version control, CI workflows, peer
        review and API access.
      homepage_url: https://docs.infrahub.app/
      license_model: open_core
      publisher_sources: [https://docs.infrahub.app/overview]
      description_sources: [https://docs.infrahub.app/overview]
      license_model_sources: [https://github.com/opsmill/infrahub]
      coverage_claims:
        data:
          - building_block: Intent
            extent: full
            note: The README describes Infrahub as one source of truth for infrastructure data.
            sources: [https://github.com/opsmill/infrahub]

    - name: Ansible
      publisher: Red Hat
      description: >-
        An agentless automation tool that manages network devices from many vendors over SSH or
        HTTPS, using playbooks and vendor modules.
      homepage_url: https://www.ansible.com/
      license_model: open_source
      publisher_sources: [https://github.com/ansible/ansible]
      description_sources: [https://docs.ansible.com/ansible/latest/network/getting_started/index.html]
      license_model_sources: [https://github.com/ansible/ansible]
      coverage_claims:
        data:
          - building_block: Executor
            extent: full
            note: Network resource modules merge, replace, override or delete device configuration.
            sources:
              - https://docs.ansible.com/ansible/latest/network/user_guide/network_resource_modules.html
          - building_block: Collector
            extent: partial
            note: >-
              Gathers device facts when a playbook runs. It does not poll devices on its own.
            sources:
              - https://docs.ansible.com/ansible/latest/network/getting_started/first_playbook.html

    - name: SuzieQ
      publisher: Stardust Systems
      description: >-
        A multi-vendor network observability application that collects device state over SSH or
        REST API, stores it in Parquet files and answers questions about it through a CLI, GUI,
        REST API or Python.
      homepage_url: https://suzieq.readthedocs.io/en/latest/
      license_model: open_core
      publisher_sources: [https://github.com/netenglabs/suzieq]
      description_sources: [https://suzieq.readthedocs.io/en/latest/]
      license_model_sources: [https://github.com/netenglabs/suzieq]
      coverage_claims:
        data:
          - building_block: Collector
            extent: full
            note: The poller gathers data from devices over SSH or REST API.
            sources: [https://suzieq.readthedocs.io/en/latest/]
          - building_block: Observability
            extent: full
            note: Stores collected state in Parquet files and provides analysis on top of it.
            sources: [https://suzieq.readthedocs.io/en/latest/]
---
# Products added from the Network Automation Map (2026-10-21).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CatalogProduct
  data:
  - name: Network Performance Monitor
    publisher: SolarWinds
    description: Polls multi-vendor network devices to track availability, traffic and hardware health,
      and shows the results in dashboards, maps and threshold-based alerts.
    homepage_url: https://www.solarwinds.com/network-performance-monitor
    license_model: commercial
    license_model_sources:
    - https://documentation.solarwinds.com/en/success_center/npm/content/npm_licensing_model.htm
    publisher_sources:
    - https://www.solarwinds.com/network-performance-monitor
    description_sources:
    - https://www.solarwinds.com/network-performance-monitor
    coverage_claims:
      data:
      - building_block: Collector
        extent: full
        note: Polling devices to read their performance state is the main purpose of the product.
        sources:
        - https://www.solarwinds.com/network-performance-monitor
      - building_block: Observability
        extent: full
        note: The product keeps current and historical device state and processes it into alerts against
          thresholds and baselines.
        sources:
        - https://www.solarwinds.com/network-performance-monitor
      - building_block: Presentation
        extent: partial
        note: The product offers dashboards and reports for its own monitoring data, not a general interface
          for an automation system.
        sources:
        - https://www.solarwinds.com/network-performance-monitor
  - name: Kentik
    publisher: Kentik
    description: Collects network telemetry such as flow, SNMP and streaming telemetry from data center,
      cloud and internet networks, stores it, and lets users query and visualize it.
    homepage_url: https://www.kentik.com/
    license_model: commercial
    license_model_sources:
    - https://www.kentik.com/pricing/
    publisher_sources:
    - https://www.kentik.com/product/
    description_sources:
    - https://www.kentik.com/product/
    coverage_claims:
      data:
      - building_block: Collector
        extent: full
        note: Collecting flow, device and routing telemetry from the network is the main purpose of the
          product.
        sources:
        - https://www.kentik.com/product/
      - building_block: Observability
        extent: full
        note: The product stores the collected network state and provides query and analysis on it.
        sources:
        - https://www.kentik.com/product/
      - building_block: Presentation
        extent: partial
        note: The product provides views of its own telemetry data, not a general interface for an automation
          system.
        sources:
        - https://www.kentik.com/product/
  - name: LibreNMS
    publisher: LibreNMS
    description: Network monitoring system that discovers devices with protocols such as SNMP, LLDP and
      CDP, collects their data, graphs it and sends alerts.
    homepage_url: https://www.librenms.org/
    license_model: open_source
    license_model_sources:
    - https://raw.githubusercontent.com/librenms/librenms/master/LICENSE.txt
    publisher_sources:
    - https://raw.githubusercontent.com/librenms/librenms/master/README.md
    description_sources:
    - https://www.librenms.org/
    coverage_claims:
      data:
      - building_block: Collector
        extent: full
        note: Discovering devices and reading their state over SNMP is the main purpose of the product.
        sources:
        - https://raw.githubusercontent.com/librenms/librenms/master/README.md
      - building_block: Observability
        extent: full
        note: The product stores collected device data and processes it into alerts.
        sources:
        - https://www.librenms.org/
      - building_block: Presentation
        extent: partial
        note: The product provides graphs, a web interface and an API for its own monitoring data.
        sources:
        - https://www.librenms.org/
  - name: Zabbix
    publisher: Zabbix
    description: Monitoring software that collects metrics from network devices, servers and applications,
      detects problems against thresholds, sends notifications and shows the data in dashboards and maps.
    homepage_url: https://www.zabbix.com/
    license_model: open_source
    license_model_sources:
    - https://www.zabbix.com/features
    publisher_sources:
    - https://www.zabbix.com/features
    description_sources:
    - https://www.zabbix.com/features
    coverage_claims:
      data:
      - building_block: Collector
        extent: full
        note: Collecting metrics from devices with agents and agent-less methods is a main purpose of
          the product.
        sources:
        - https://www.zabbix.com/features
      - building_block: Observability
        extent: full
        note: The product stores collected metrics and processes them into problems, trends and anomalies.
        sources:
        - https://www.zabbix.com/features
      - building_block: Presentation
        extent: partial
        note: The product provides dashboards and maps for its own monitoring data, not a general interface
          for an automation system.
        sources:
        - https://www.zabbix.com/features
  - name: Nagios Core
    publisher: Nagios Enterprises
    description: Monitoring software that runs plugin-based checks against servers, network devices, websites
      and services, and alerts on problems, with a basic web interface.
    homepage_url: https://www.nagios.org/projects/nagios-core/
    license_model: open_source
    license_model_sources:
    - https://www.nagios.org/projects/nagios-core/
    publisher_sources:
    - https://www.nagios.org/projects/nagios-core/
    description_sources:
    - https://www.nagios.org/projects/nagios-core/
    coverage_claims:
      data:
      - building_block: Observability
        extent: partial
        note: The product checks the state of network devices and other IT systems, but the page does
          not describe how it persists that state, and networks are one of several targets.
        sources:
        - https://www.nagios.org/projects/nagios-core/
      - building_block: Collector
        extent: partial
        note: The product reads device state through plugins as part of its checks, with network devices
          as one of several target types.
        sources:
        - https://www.nagios.org/projects/nagios-core/
      - building_block: Presentation
        extent: partial
        note: The product page describes only a basic web interface; configuration uses text files.
        sources:
        - https://www.nagios.org/projects/nagios-core/
  - name: PRTG Network Monitor
    publisher: Paessler
    description: On-premises Windows software that monitors devices, systems and traffic through sensors
      such as SNMP, and provides maps, dashboards, alerts and reports.
    homepage_url: https://www.paessler.com/prtg/prtg-network-monitor
    license_model: commercial
    license_model_sources:
    - https://www.paessler.com/prtg/prtg-network-monitor
    publisher_sources:
    - https://www.paessler.com/prtg/prtg-network-monitor
    description_sources:
    - https://www.paessler.com/prtg/prtg-network-monitor
    coverage_claims:
      data:
      - building_block: Collector
        extent: full
        note: Reading values from network devices through sensors is the main purpose of the product.
        sources:
        - https://www.paessler.com/prtg/prtg-network-monitor
      - building_block: Observability
        extent: full
        note: The product stores sensor data and processes it into alerts and reports.
        sources:
        - https://www.paessler.com/prtg/prtg-network-monitor
      - building_block: Presentation
        extent: partial
        note: The product provides maps and dashboards for its own monitoring data, not a general interface
