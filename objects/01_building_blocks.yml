---
# Building blocks of the Network Automation Framework.
# Source: https://reference.networkautomation.forum/Framework/Framework/
# Names and descriptions are copied word for word from the "Architecture" list on that page.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CatalogBuildingBlock
  data:
    - name: Intent
      description: >-
        Defines the logic to handle and the persistence layer to store the desired state of the
        network, including both configuration and operational expectations.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - name: Observability
      description: >-
        It persists the actual network state, and defines the logic to process it.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - name: Orchestrator
      description: >-
        Defines how the automation tasks are coordinated and executed in response to events.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - name: Executor
      description: >-
        Encompasses the actual tasks applied to the network to drive changes (e.g., updating
        configuration) as guided by the intended state.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - name: Collector
      description: >-
        In contrast to Executor, this component focuses on retrieving (i.e., reading) the actual
        state of the network.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#collector
    - name: Presentation
      description: >-
        Provides the interfaces through which users interact with the system, including
        dashboards, graphical user interfaces (e.g., ITSM), and CLI tools.
      definition_url: https://reference.networkautomation.forum/Framework/Framework/#presentation
---
# Requirements of the Network Automation Framework, one record for each MUST, SHOULD or MAY.
# Statements are copied word for word from https://reference.networkautomation.forum/Framework/Framework/
# as it was on 2026-10-23 (CC0). Where one sentence holds two keywords, it is recorded twice, and the
# summary says which part each record covers. Summaries are the catalog's own words.
# Generated from dev/knowledge/naf-requirements-2026-10-23/requirements.json.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CatalogRequirement
  data:
    - identifier: framework-should-1
      level: should
      position: 1
      summary: "Follows software engineering practices such as version control and CI/CD"
      statement: >-
        All components SHOULD follow modern software engineering practices, such as version control
        and CI/CD, and expose machine-friendly APIs (documented via schema). This ensures seamless
        integration with internal systems and external tooling for security, logging, observability,
        and traceability.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#context
    - identifier: framework-should-2
      level: should
      position: 2
      summary: "Exposes machine-friendly APIs documented by a schema"
      statement: >-
        All components SHOULD follow modern software engineering practices, such as version control
        and CI/CD, and expose machine-friendly APIs (documented via schema). This ensures seamless
        integration with internal systems and external tooling for security, logging, observability,
        and traceability.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#context
    - identifier: intent-must-1
      building_block: Intent
      level: must
      position: 3
      summary: "Represents any network-related aspect in a structured form"
      statement: >-
        It MUST be capable of representing, in a structured form, any network-related aspect. This
        broad scope includes, but is not limited to, data such as IP addressing, data center
        infrastructure (e.g., racks, cabling), routing protocols, virtualized services, secrets,
        operational levels (such as maximum CPU), configuration templates or data mappings, and
        artifacts, as well as service abstraction or policy definitions.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-must-2
      building_block: Intent
      level: must
      position: 4
      summary: "Supports create, read, update and delete on the data"
      statement: >-
        The data MUST support create, read, update, and delete operations.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-must-3
      building_block: Intent
      level: must
      position: 5
      summary: "Exposes the data through a standardized, documented API"
      statement: >-
        Access to this information MUST be exposed through a standardized, well-documented
        Application Programming Interface (API) (e.g., REST, GraphQL, etc.).
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-should-1
      building_block: Intent
      level: should
      position: 6
      summary: "Uses a vendor-neutral model that is turned into vendor configuration"
      statement: >-
        The modeling SHOULD use a neutral representation that will be derived into vendor-specific
        configuration artifacts.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-should-2
      building_block: Intent
      level: should
      position: 7
      summary: "Gives one consistent view of the desired state across data sources"
      statement: >-
        It SHOULD provide a consistent and unified view of the desired state, even when the data is
        distributed across multiple data sources.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-should-3
      building_block: Intent
      level: should
      position: 8
      summary: "Records governance metadata: timestamps, origin, ownership, validity"
      statement: >-
        In addition to the core network data, it SHOULD include metadata that supports effective
        data governance, such as timestamps, data origin, data ownership, and valid periods.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-should-4
      building_block: Intent
      level: should
      position: 9
      summary: "Offers transactional changes, custom validation and versioned data"
      statement: >-
        Ideally, these operations SHOULD be transactional, offer custom validation, and provide a
        versioned access to data.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: intent-may-1
      building_block: Intent
      level: may
      position: 10
      summary: "Includes intended-state logic such as validation and artifact generation"
      statement: >-
        It MAY include all the logic related to intended state management, such as data validation,
        data aggregation or replication, breaking down abstract services into concrete objects, and
        combining data to generate configuration artifacts.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#intent
    - identifier: executor-must-1
      building_block: Executor
      level: must
      position: 11
      summary: "Writes to the network over SSH, NETCONF, gNMI/gNOI and REST APIs"
      statement: >-
        It MUST be capable of interacting with any of the supported network write interfaces,
        including SSH, NETCONF, gNMI/gNOI, and REST APIs.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-should-1
      building_block: Executor
      level: should
      position: 12
      summary: "Supports any operation that changes the network state"
      statement: >-
        It SHOULD support any network operation that alters the network state, such as deploying a
        full or partial configuration artifact or performing device actions like reboots and
        software updates.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-should-2
      building_block: Executor
      level: should
      position: 13
      summary: "Takes task input from the intended state"
      statement: >-
        The task input SHOULD come from the intended state or be derived from it through data
        originating from the Observability component.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-should-3
      building_block: Executor
      level: should
      position: 14
      summary: "Offers a dry run of an execution"
      statement: >-
        It SHOULD provide a dry-run operation to check the expected result of the execution without
        actually executing it.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-should-4
      building_block: Executor
      level: should
      position: 15
      summary: "Applies changes as a transaction"
      statement: >-
        It SHOULD support transactional execution of the changes.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-may-1
      building_block: Executor
      level: may
      position: 16
      summary: "Supports both imperative and declarative tasks"
      statement: >-
        It MAY support both imperative approaches (where the task defines how to operate) and
        declarative approaches (where the task defines what the desired outcome is, and the system
        determines how to achieve it). In both cases, the operation SHOULD be idempotent; rerunning
        it should produce the same result.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: executor-should-5
      building_block: Executor
      level: should
      position: 17
      summary: "Runs operations idempotently"
      statement: >-
        It MAY support both imperative approaches (where the task defines how to operate) and
        declarative approaches (where the task defines what the desired outcome is, and the system
        determines how to achieve it). In both cases, the operation SHOULD be idempotent; rerunning
        it should produce the same result.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#executor
    - identifier: collector-must-1
      building_block: Collector
      level: must
      position: 18
      summary: "Reads live network data, including SNMP, Syslog, flows and packets"
      statement: >-
        It MUST includes capabilities for retrieving live data from the network using read
        interfaces—similar to the Executor component—but extends support to additional protocols to
        capture metrics and log, such as SNMP, Syslog, and other data such as flow-based telemetry
        (e.g., NetFlow, sFlow), packet capturing, traces, and others.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#collector
    - identifier: collector-should-1
      building_block: Collector
      level: should
      position: 19
      summary: "Normalizes data across vendors and collection methods"
      statement: >-
        The data values SHOULD be normalized from different vendors and method specifics.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#collector
    - identifier: observability-must-1
      building_block: Observability
      level: must
      position: 20
      summary: "Stores historical data with powerful programmatic access"
      statement: >-
        It MUST support historical data persistence and offer powerful programmatic access to this
        data—enabling advanced analytics, reporting, and troubleshooting workflows.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - identifier: observability-should-1
      building_block: Observability
      level: should
      position: 21
      summary: "Offers a capable query language"
      statement: >-
        It SHOULD offer a capable query language to extract the data.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - identifier: observability-should-2
      building_block: Observability
      level: should
      position: 22
      summary: "Detects drift from the intended state and generates events"
      statement: >-
        It SHOULD expose relevant insights into the current network state and automatically generate
        events when discrepancies are detected between the actual state (configuration or
        operational) and the intended state. These events MAY be processed by humans or connected to
        the Orchestration block to be automatically processed.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - identifier: observability-may-1
      building_block: Observability
      level: may
      position: 23
      summary: "Sends drift events to people or to the Orchestrator"
      statement: >-
        It SHOULD expose relevant insights into the current network state and automatically generate
        events when discrepancies are detected between the actual state (configuration or
        operational) and the intended state. These events MAY be processed by humans or connected to
        the Orchestration block to be automatically processed.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - identifier: observability-may-2
      building_block: Observability
      level: may
      position: 24
      summary: "Enriches data with intended state and third-party context"
      statement: >-
        Retrieved data MAY be enriched with contextual information from the intended state,
        including other third-party sources (e.g., EoL information, CVEs, maintenance notifications,
        etc.), enhancing analysis and enabling more accurate data correlation.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#observability
    - identifier: orchestrator-must-1
      building_block: Orchestrator
      level: must
      position: 25
      summary: "Coordinates processes across the building blocks into workflows"
      statement: >-
        It MUST enable the coordination and integration of processes across the various building
        blocks, allowing the creation of more sophisticated and end-to-end automation workflows.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-should-1
      building_block: Orchestrator
      level: should
      position: 26
      summary: "Runs workflows from events, synchronous, asynchronous or scheduled"
      statement: >-
        Process execution SHOULD follow an event-driven approach, where events can be received
        synchronously, asynchronously, or generated on a scheduled basis.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-should-2
      building_block: Orchestrator
      level: should
      position: 27
      summary: "Supports compensating actions for a controlled rollback"
      statement: >-
        Execution logic SHOULD allow for reverse/compensating actions when a step results in an
        error or unexpected result, allowing for a controlled rollback. This may be hard to
        implement due to network infrastructure limitations.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-should-3
      building_block: Orchestrator
      level: should
      position: 28
      summary: "Offers a dry run of a workflow"
      statement: >-
        It SHOULD provide a dry-run operation to check the expected result of the workflow without
        actually executing it.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-should-4
      building_block: Orchestrator
      level: should
      position: 29
      summary: "Schedules workflows on a regular basis or at a set time"
      statement: >-
        It SHOULD provide the ability to schedule the execution of a workflow on a regular basis or
        at a given time in the future.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-should-5
      building_block: Orchestrator
      level: should
      position: 30
      summary: "Gives logging and traceability of past and current workflows"
      statement: >-
        It SHOULD provide end users with an understanding of the whole automation logging and
        traceability in the past and current workflows.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: orchestrator-may-1
      building_block: Orchestrator
      level: may
      position: 31
      summary: "Correlates events to decide the course of action"
      statement: >-
        It MAY include logic to correlate multiple events, infer relationships, and determine the
        appropriate course of action based on the event context.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#orchestrator
    - identifier: presentation-must-1
      building_block: Presentation
      level: must
      position: 32
      summary: "Provides robust authentication and authorization"
      statement: >-
        It MUST provide robust and flexible authentication and authorization capabilities.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#presentation
    - identifier: presentation-may-1
      building_block: Presentation
      level: may
      position: 33
      summary: "Takes forms such as GUIs, ITSM, chat, portals or dashboards"
      statement: >-
        This component MAY take various forms depending on the needs of the end user, including
        graphical user interfaces, ITSM, change management systems, messaging platforms,
        documentation portals, or reporting dashboards.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#presentation
    - identifier: presentation-may-2
      building_block: Presentation
      level: may
      position: 34
      summary: "Supports both read and write interactions"
      statement: >-
        It MAY support both read and write interactions, enabling users to view data, initiate
        tasks, or approve changes.
      reference_url: https://reference.networkautomation.forum/Framework/Framework/#presentation
