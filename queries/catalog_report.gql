# Data for the catalog coverage report (transforms/catalog_report.py).
query catalog_report($report: String!) {
  CatalogReport(name__value: $report) {
    edges {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  CatalogBuildingBlock {
    edges {
      node {
        id
        __typename
        name {
          value
        }
      }
    }
  }
  CatalogRequirement {
    edges {
      node {
        id
        __typename
        identifier {
          value
        }
        level {
          value
        }
        building_block {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }
  CatalogProduct {
    edges {
      node {
        id
        __typename
        full_name {
          value
        }
        status {
          value
        }
        coverage_claims {
          edges {
            node {
              id
              __typename
              verdicts {
                edges {
                  node {
                    verdict {
                      value
                    }
                    requirement {
                      node {
                        identifier {
                          value
                        }
                      }
                    }
                  }
                }
              }
              building_block {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
