installed:
- checkpoint
- critique
- infrahub-speckit
- pov
settings:
  auto_execute_hooks: true
hooks:
  after_plan:
  - extension: critique
    command: speckit.critique.run
    enabled: true
    optional: true
    priority: 10
    prompt: Run spec critique before proceeding to tasks?
    description: Challenges the spec and plan through product and engineering lenses
    condition: null
  after_taskstoissues:
  - extension: pov
    command: speckit.pov.summary
    enabled: true
    optional: true
    priority: 10
    prompt: Produce a session summary in the feature directory?
    description: Flow-level timeline next to spec.md/plan.md, capturing the handoff
      to the issue tracker.
    condition: null
  before_specify:
  - extension: infrahub-speckit
    command: speckit.infrahub-speckit.route-specify
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.infrahub-speckit.route-specify?
    description: Infrahub artifact routing before specification
    condition: null
  before_plan:
  - extension: infrahub-speckit
    command: speckit.infrahub-speckit.route-plan
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.infrahub-speckit.route-plan?
    description: Infrahub artifact routing before planning
    condition: null
  before_implement:
  - extension: infrahub-speckit
    command: speckit.infrahub-speckit.route-implement
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.infrahub-speckit.route-implement?
    description: Infrahub artifact routing before implementation
    condition: null
