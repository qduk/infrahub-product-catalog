---
# Infrahub repository configuration.
# Schemas and object files are loaded with infrahubctl on an Infrahub branch, not imported from
# this repository, so that data reaches main only through a proposed change.
queries:
  - name: catalog_source_check
    file_path: queries/catalog_source_check.gql
  - name: catalog_report
    file_path: queries/catalog_report.gql
  - name: catalog_records
    file_path: queries/catalog_records.gql
  - name: catalog_verdict_check
    file_path: queries/catalog_verdict_check.gql

check_definitions:
  - name: catalog_source_check
    class_name: CatalogSourceCheck
    file_path: checks/catalog_source_check.py
  - name: catalog_submission_check
    class_name: CatalogSubmissionCheck
    file_path: checks/catalog_record_checks.py
  - name: catalog_duplicate_check
    class_name: CatalogDuplicateCheck
    file_path: checks/catalog_record_checks.py
  - name: catalog_coverage_check
    class_name: CatalogCoverageCheck
    file_path: checks/catalog_record_checks.py
  - name: catalog_unused_source_check
    class_name: CatalogUnusedSourceCheck
    file_path: checks/catalog_record_checks.py
  - name: catalog_verdict_check
    class_name: CatalogVerdictCheck
    file_path: checks/catalog_verdict_check.py

python_transforms:
  - name: catalog_report
    class_name: CatalogReportTransform
    file_path: transforms/catalog_report.py

artifact_definitions:
  - name: catalog_coverage_report
    artifact_name: catalog-coverage-report
    content_type: text/markdown
    targets: catalog_reports
    transformation: catalog_report
    parameters:
      report: name__value
