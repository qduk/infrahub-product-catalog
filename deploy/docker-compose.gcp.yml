---
# Settings for the beta deployment on a GCP virtual machine. Used with the unmodified
# docker-compose.yml from the repository root, instead of docker-compose.override.yml:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.gcp.yml --env-file deploy/.env up -d
#
# Only Caddy (the web service) is published. It serves the web app to anyone, and Infrahub's web
# interface on its own host name behind Infrahub's login.
name: infrahub-product-catalog

services:
  message-queue:
    ports: !reset []
  database:
    ports: !reset []
  infrahub-server:
    ports: !reset []

  # One worker, with its copy of the Git repository on a volume. On Infrahub 1.11.8, a worker that
  # has no copy of a read-only repository cannot run the repository's checks: run_user_check looks
  # the repository up as a CoreRepository and fails with NodeNotFoundError. The copy is made by
  # "Import latest commit"; with one worker and a volume, it is always the one the checks use.
  task-worker:
    deploy:
      replicas: 1
    volumes:
      - git_data:/opt/infrahub/git

  catalog-api:
    build: frontend/api
    restart: unless-stopped
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${CATALOG_API_TOKEN:-}
      SUBMISSIONS_PER_ADDRESS_PER_HOUR: ${SUBMISSIONS_PER_ADDRESS_PER_HOUR:-5}
      SUBMISSIONS_PER_HOUR: ${SUBMISSIONS_PER_HOUR:-50}
    depends_on:
      infrahub-server:
        condition: service_healthy

  web:
    build: frontend/web
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in deploy/.env}
      INFRAHUB_HOST: ${INFRAHUB_HOST:?set INFRAHUB_HOST in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - catalog-api

volumes:
  git_data:
  caddy_data:
  caddy_config:
